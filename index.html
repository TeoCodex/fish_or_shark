<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Five V Poker Trainer Coach</title>
<script data-goatcounter="https://teocodex.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<style>
  :root{
    --felt:#0C3B2E; --felt-mid:#11503E; --cream:#F6F1E3; --brass:#C9A227;
    --red:#C34036; --ink:#17211C; --dim:#D9D2BE;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    background:radial-gradient(ellipse at 50% -10%, var(--felt-mid) 0%, var(--felt) 55%, #082A20 100%);
    background-attachment:fixed;
    color:var(--cream);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    min-height:100vh;
  }
  #app{max-width:480px;margin:0 auto;padding:20px 16px 44px;min-height:100vh}
  h1,h2,.big-num{font-family:Georgia,"Times New Roman",serif}
  .label{font-size:11px;letter-spacing:3px;color:var(--brass);text-transform:uppercase;font-weight:700}
  .btn{display:block;width:100%;text-align:left;background:rgba(246,241,227,.07);color:var(--cream);
    border:1px solid rgba(246,241,227,.18);border-radius:10px;padding:13px 15px;font-size:15px;
    font-weight:600;margin-bottom:10px;cursor:pointer;font-family:inherit;line-height:1.35}
  .btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  .btn.gold{background:var(--brass);color:var(--ink);border-color:var(--brass)}
  .btn.center{text-align:center}
  .btn .row{display:flex;justify-content:space-between;align-items:center}
  .btn .sub{font-size:12.5px;color:var(--dim);font-weight:400;margin-top:3px}
  .btn.gold .sub{color:var(--ink)}
  .btn .score{color:var(--brass);font-size:13px;font-weight:700}
  .btn.gold .score{color:var(--ink)}
  .btn:disabled{cursor:default}
  .btn.opt-right{background:rgba(201,162,39,.25);border-color:var(--brass)}
  .btn.opt-wrong{background:rgba(195,64,54,.3);border-color:var(--red)}
  .btn.opt-mute{color:rgba(246,241,227,.4)}
  .back{background:none;border:none;color:var(--brass);font-size:13px;cursor:pointer;padding:0;
    font-weight:700;font-family:inherit;margin-bottom:14px}
  .lesson-p{font-size:14.5px;line-height:1.65;color:var(--dim);margin-bottom:12px}
  .lesson-p.lead{color:var(--cream)}
  .cards-row{display:flex;justify-content:center;gap:10px;margin:8px 0 12px}
  .pcard{width:62px;height:88px;background:var(--cream);border-radius:8px;flex-shrink:0;
    box-shadow:0 3px 8px rgba(0,0,0,.45), inset 0 0 0 1px rgba(23,33,28,.15);
    display:flex;flex-direction:column;justify-content:space-between;padding:6px 8px;
    font-family:Georgia,serif;user-select:none}
  .pcard.sm{width:40px;height:56px;padding:4px 5px}
  .pcard .tl{font-size:21px;font-weight:700;line-height:1}
  .pcard.sm .tl{font-size:15px}
  .pcard .tl span{display:block;font-size:17px}
  .pcard.sm .tl span{font-size:12px}
  .pcard .br{font-size:26px;text-align:right;line-height:1}
  .pcard.sm .br{font-size:16px}
  .red{color:var(--red)} .blk{color:var(--ink)}
  .scenario{font-size:14.5px;line-height:1.55;text-align:center;margin:0 4px 15px;color:var(--cream)}
  .feedback{background:rgba(0,0,0,.28);border-left:3px solid var(--brass);border-radius:8px;
    padding:12px 14px;margin:6px 0 14px}
  .feedback.wrong{border-left-color:var(--red)}
  .feedback .verdict{font-size:12px;font-weight:800;letter-spacing:2px;color:var(--brass);margin-bottom:5px}
  .feedback.wrong .verdict{color:var(--red)}
  .feedback .expl{font-size:13.5px;line-height:1.6;color:var(--dim)}
  .rulebox{background:rgba(201,162,39,.12);border:1px solid rgba(201,162,39,.45);border-radius:8px;
    padding:9px 12px;margin-top:8px;font-size:13px;font-weight:700;color:var(--brass);line-height:1.45}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;
    font-size:12px;color:var(--dim)}
  .simbar{display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,.3);
    border-radius:8px;padding:8px 13px;margin-bottom:6px}
  .simbar .lvl{font-size:11.5px;color:var(--brass);font-weight:700;letter-spacing:1px}
  .simbar .stk{font-size:14px;font-weight:800}
  .simbar .stk.danger{color:var(--red)}
  .grid13{display:grid;grid-template-columns:repeat(13,1fr);gap:1.5px;margin-top:2px}
  .cell{aspect-ratio:1;border-radius:3px;background:rgba(246,241,227,.06);color:rgba(246,241,227,.35);
    font-size:7.5px;font-weight:700;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .cell.in-s{background:rgba(201,162,39,.75);color:var(--ink)}
  .cell.in-o{background:rgba(201,162,39,.5);color:var(--ink)}
  .cell.in-p{background:var(--brass);color:var(--ink)}
  .gridfoot{display:flex;justify-content:space-between;margin-top:8px;font-size:11.5px;color:var(--dim)}
  .toggle-row{display:flex;gap:8px;margin:6px 0 10px}
  .toggle-row button{flex:1;padding:9px 0;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;
    background:rgba(246,241,227,.07);color:var(--cream);border:1px solid rgba(246,241,227,.18);font-family:inherit}
  .toggle-row button.on{background:var(--brass);color:var(--ink);border-color:var(--brass)}
  .pcard.xs{width:27px;height:38px;padding:2px 3px;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.4), inset 0 0 0 1px rgba(23,33,28,.12)}
  .pcard.xs .tl{font-size:10px}
  .pcard.xs .tl span{font-size:9px}
  .pcard.xs .br{display:none}
  .ladder{margin:6px 0 18px}
  .ladder-row{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;margin-bottom:5px;background:rgba(0,0,0,.22)}
  .ladder-row.hot{background:rgba(201,162,39,.14);border:1px solid rgba(201,162,39,.4)}
  .ladder-num{width:20px;flex-shrink:0;text-align:center;font-family:Georgia,serif;font-size:15px;font-weight:700;color:var(--brass)}
  .ladder-info{flex:1;min-width:0}
  .ladder-name{font-size:13px;font-weight:700}
  .ladder-note{font-size:11px;color:var(--dim);line-height:1.3}
  .ladder-cards{display:flex;gap:2.5px;flex-shrink:0}
  .nightmap{margin:14px 0 20px;position:relative;padding-left:18px}
  .nightmap::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:rgba(201,162,39,.35);border-radius:2px}
  .nm-row{position:relative;padding:0 0 14px 8px}
  .nm-row::before{content:"";position:absolute;left:-17px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--brass);box-shadow:0 0 0 3px rgba(201,162,39,.2)}
  .nm-row.warn::before{background:var(--red);box-shadow:0 0 0 3px rgba(195,64,54,.25)}
  .nm-time{font-size:12px;font-weight:800;color:var(--brass);letter-spacing:1px}
  .nm-row.warn .nm-time{color:var(--red)}
  .nm-title{font-size:13.5px;font-weight:700;margin-top:1px}
  .nm-sub{font-size:12px;color:var(--dim);line-height:1.45;margin-top:1px}
  .nm-chip{display:inline-block;background:rgba(201,162,39,.16);border:1px solid rgba(201,162,39,.4);color:var(--brass);border-radius:5px;font-size:10.5px;font-weight:700;padding:1px 6px;margin-left:5px;vertical-align:1px}
    .vizbox{background:rgba(0,0,0,.22);border-radius:10px;padding:12px 8px 10px;margin:4px 0 16px}
  .viz-title{font-size:10.5px;letter-spacing:2px;color:var(--brass);text-transform:uppercase;font-weight:700;text-align:center;margin-bottom:10px}
  .viz-cap{font-size:11.5px;color:var(--dim);text-align:center;margin-top:9px;line-height:1.45;padding:0 6px}
  .chiprow{display:flex;flex-wrap:wrap;gap:12px 14px;justify-content:center}
  .handchip{display:flex;flex-direction:column;align-items:center;gap:4px}
  .hc-cards{display:flex;gap:2px}
  .hc-tag{font-size:8.5px;font-weight:800;letter-spacing:1px;padding:2px 7px;border-radius:4px}
  .t-raise{background:var(--brass);color:var(--ink)}
  .t-fold{background:rgba(246,241,227,.14);color:var(--dim)}
  .t-shove{background:var(--red);color:var(--cream)}
  .t-defend{background:#1A6A52;color:var(--cream)}
  .duel{display:flex;justify-content:center;gap:26px;align-items:flex-start;margin-bottom:8px}
  .duel-hand{display:flex;flex-direction:column;align-items:center;gap:4px}
  .duel-who{font-size:10px;font-weight:800;letter-spacing:1px}
  .board-strip{display:flex;gap:3px;justify-content:center;margin-top:2px}
  .board-lbl{font-size:9.5px;letter-spacing:2px;color:var(--dim);text-align:center;margin-bottom:4px}
  .streets{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
  .st-group{display:flex;flex-direction:column;align-items:center;gap:4px}
  .st-cards{display:flex;gap:2px}
  .st-lbl{font-size:8.5px;letter-spacing:1px;font-weight:800;color:var(--dim)}
  .st-arrow{color:var(--brass);font-size:15px;font-weight:700;padding-bottom:14px}
  .phasebars{display:flex;align-items:flex-end;gap:16px;justify-content:center;height:120px;padding-top:4px}
  .pb-col{display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
  .pb-bar{width:62px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,#E3BC3F,var(--brass));box-shadow:inset 0 -3px 8px rgba(0,0,0,.25)}
  .pb-bb{font-size:12px;font-weight:800;color:var(--brass)}
  .pb-lbl{font-size:9.5px;color:var(--dim);text-align:center;line-height:1.3}
  .tb-wrap{display:flex;gap:12px;justify-content:center;margin:4px 0 2px}
  .tb{padding:15px 24px;border-radius:12px;font-weight:800;font-size:15px;letter-spacing:1.5px}
  .tb.allin{background:var(--brass);color:var(--ink);box-shadow:0 3px 10px rgba(201,162,39,.35)}
  .tb.fold{background:rgba(246,241,227,.1);color:var(--cream);border:1px solid rgba(246,241,227,.25)}
  .tb-no{text-align:center;margin-top:10px;font-size:13px;color:var(--red);font-weight:700}
  .tb-no s{opacity:.85}
  .ptypes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .ptype{background:rgba(0,0,0,.25);border:1px solid rgba(246,241,227,.15);border-radius:10px;padding:10px 11px}
  .ptype.hot{border-color:rgba(201,162,39,.55);background:rgba(201,162,39,.1)}
  .pt-icon{font-size:20px;line-height:1}
  .pt-name{font-size:13px;font-weight:800;margin:4px 0 2px}
  .pt-tell{font-size:11px;color:var(--dim);line-height:1.4}
  .pt-beat{font-size:11px;color:var(--brass);font-weight:700;margin-top:6px;line-height:1.35}
  .infosplit{display:flex;flex-direction:column;gap:10px}
  .info-half{display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.2);border-radius:8px;padding:9px 10px}
  .info-half.good{border:1px solid rgba(201,162,39,.4)}
  .ih-cards{display:flex;gap:2px;flex-shrink:0}
  .ih-txt{font-size:11.5px;line-height:1.45;color:var(--dim)}
  .ih-txt b{color:var(--cream);font-size:12px}
  .info-half.good .ih-txt b{color:var(--brass)}
  .helpbtn{display:block;width:100%;text-align:center;background:transparent;color:var(--dim);border:1.5px dashed rgba(246,241,227,.3);border-radius:10px;padding:9px;font-size:12.5px;font-weight:600;margin:2px 0 10px;cursor:pointer;font-family:inherit}
  .helpbtn.on{color:var(--brass);border-color:rgba(201,162,39,.5)}
  .helppanel{background:rgba(0,0,0,.3);border:1px solid rgba(201,162,39,.3);border-radius:10px;padding:11px 13px;margin:-4px 0 12px}
  .hp-ref{font-size:12.5px;color:var(--brass);line-height:1.5;margin-bottom:8px;font-weight:600}
  .hp-item{font-size:12px;color:var(--dim);line-height:1.5;margin-bottom:5px}
  .hp-item b{color:var(--cream)}
  .nameinput{display:block;width:100%;background:rgba(0,0,0,.35);border:1px solid rgba(201,162,39,.45);border-radius:10px;padding:13px 15px;font-size:16px;color:var(--cream);font-family:inherit;text-align:center;margin:14px 0 12px;outline:none}
  .nameinput::placeholder{color:rgba(246,241,227,.35)}
  .quip{border-radius:10px;padding:12px 14px;margin:4px 0 12px;font-size:13.5px;line-height:1.55;font-weight:600}
  .quip.shark{background:rgba(201,162,39,.16);border:1px solid rgba(201,162,39,.5);color:var(--brass)}
  .quip.fish{background:rgba(195,64,54,.16);border:1px solid rgba(195,64,54,.5);color:#E8907F}
  .quip.crab{background:rgba(246,241,227,.08);border:1px solid rgba(246,241,227,.3);color:var(--dim)}
  .verdict-emoji{font-size:64px;margin:10px 0 0}
  .sharkmeter{display:flex;gap:3px;justify-content:center;margin:12px 0 4px;font-size:17px;flex-wrap:wrap}
  .assess-tag{display:inline-block;background:rgba(201,162,39,.16);border:1px solid rgba(201,162,39,.4);color:var(--brass);border-radius:6px;font-size:11px;font-weight:800;letter-spacing:1px;padding:2px 8px;margin-bottom:8px}
  .center-wrap{text-align:center;margin-top:50px}
  .big-num{font-size:64px;font-weight:700;color:var(--brass);margin:16px 0 4px}
  .fine{color:var(--dim);font-size:14px;margin:6px 28px 30px;line-height:1.55}
  @media (prefers-reduced-motion:no-preference){
    .screen{animation:fade .18s ease}
    @keyframes fade{from{opacity:.4}to{opacity:1}}
  }
</style>
</head>

<script>
"use strict";
/* ============ persistence (safe in sandboxed previews) ============ */
function loadScores(){ try{ return JSON.parse(localStorage.getItem("preflopScores")||"{}"); }catch(e){ return {}; } }
function saveScores(s){ try{ localStorage.setItem("preflopScores", JSON.stringify(s)); }catch(e){} }
function track(ev){
  try{ if(window.goatcounter&&window.goatcounter.count){ window.goatcounter.count({path:ev,title:ev,event:true}); } }catch(e){}
}
function loadProfile(){ try{ return JSON.parse(localStorage.getItem("pfProfile")||"{}"); }catch(e){ return {}; } }
function saveProfile(p){ try{ localStorage.setItem("pfProfile", JSON.stringify(p)); }catch(e){} }

/* ============ content ============ */

  else{e="🐟";t="Chum";msg="Beautiful, delicious chum"+who+". The whole table smells it. Read Chapter 1 before someone eats your buy-in — the glow-up will be spectacular.";}
  return `<div class="center-wrap" style="margin-top:36px">
    <div class="label">The verdict</div>
    <div class="verdict-emoji">${e}</div>
    <h2 style="font-size:30px;margin:6px 0 2px">${t}</h2>
    <div class="sharkmeter">${"🦈".repeat(n)}${"🐟".repeat(10-n)}</div>
    <div style="font-size:14px;color:var(--brass);font-weight:700;margin-bottom:8px">${n}/${ASSESS.length} shark answers</div>
    <p class="fine">${msg}</p>
    ${n>=7?`<button class="btn gold center" onclick="startSim()">🏆 Prove it — play Tournament Night</button><button class="btn center" onclick="openModule(0)">Start at Chapter 1 anyway</button>`
    :`<button class="btn gold center" onclick="openModule(0)">Start Chapter 1 — become the shark</button><button class="btn center" onclick="startAssess()">Retake the test</button>`}
    <button class="btn center" onclick="go('home')">See everything</button>
  </div>`;
}
function submitName(){
  const el=document.getElementById("nameInput");
  S.name=(el&&el.value?el.value.trim().slice(0,20):"");
  saveProfile({name:S.name,skipped:true,sharks:loadProfile().sharks,verdict:loadProfile().verdict});
  startAssess();
}
function skipIntro(){saveProfile({name:S.name,skipped:true});go("home");}
function startAssess(){track("assessment-started");S.aIdx=0;S.aPick=null;S.sharks=0;S.screen="assess";render();}
function assessPick(i){
  if(S.aPick!==null)return;
  S.aPick=i;
  if(ASSESS[S.aIdx].options[i].k==="shark")S.sharks++;
  render();
}
function assessNext(){
  if(S.aIdx+1<ASSESS.length){S.aIdx++;S.aPick=null;render();}
  else{
    const pr=loadProfile();pr.name=S.name;pr.skipped=true;pr.sharks=S.sharks;pr.verdict=S.sharks>=7?"🦈":"🐟";saveProfile(pr);track("assessment-completed");track(S.sharks>=7?"verdict-shark":"verdict-fish");
    S.screen="assessDone";render();
  }
}
function render(){
  const app=document.getElementById("app");
  let html="";
  if(S.screen==="intro")html=introHTML();
  else if(S.screen==="assess")html=assessHTML();
  else if(S.screen==="assessDone")html=assessDoneHTML();
  else if(S.screen==="home")html=homeHTML();
  else if(S.screen==="lesson")html=lessonHTML();
  else if(S.screen==="quiz")html=quizHTML();
  else if(S.screen==="done")html=doneHTML();
  else if(S.screen==="run")html=runHTML();
  else if(S.screen==="runDone")html=runDoneHTML();
  else if(S.screen==="sim")html=simHTML();
  else if(S.screen==="simDone")html=simDoneHTML();
  app.innerHTML=`<div class="screen">${html}</div>`;
  window.scrollTo(0,0);
}

function homeHTML(){
  const chapters=CHAPTERS.map((m,i)=>{
    const sc=S.scores[m.id];
    return `<button class="btn" onclick="openModule(${i})">
      <div class="row"><span>${m.title}</span><span class="score">${sc?sc.right+"/"+sc.total:"→"}</span></div>
      <div class="sub">${m.tagline}</div></button>`;
  }).join("");
  const runs=[RUN_A,RUN_B].map((r)=>{
    const sc=S.scores[r.id];
    return `<button class="btn" onclick="startRun('${r.id}')">
      <div class="row"><span>${r.title}</span><span class="score">${sc?sc.right+"/"+sc.total:"→"}</span></div>
      <div class="sub">${r.desc}</div></button>`;
  }).join("");
  return `
  <div style="text-align:center;margin:16px 0 4px">
    <div class="label">Five V Poker Trainer Coach</div>
    <h1 style="font-size:32px;margin:8px 0 4px;font-weight:700">${S.name?esc(S.name)+", win the<br>office tournament":"Win the office<br>tournament"}</h1>
    <p style="color:var(--dim);font-size:13.5px;margin:8px 14px 0">Built for the 6pm poker night: 15,000 chips, 300bb deep at the start, top-up until the 7:00 break, blinds accelerating hard after 8:30. Every hand ends with one rule to memorise.</p>
  </div>
  <div class="cards-row" style="margin:16px 0 18px">${cardHTML("A♠",true)}${cardHTML("A♥",true)}</div>
  ${nightMapHTML()}
  <button class="btn" onclick="startAssess()" style="border-color:rgba(201,162,39,.45)">
    <div class="row"><span>🦈🐟 Fish or Shark? — quick test</span><span class="score">${(loadProfile().sharks!==undefined)?loadProfile().verdict+" "+loadProfile().sharks+"/10":"→"}</span></div>
    <div class="sub">Ten real moments from poker night. Find out if this guide is for you.</div>
  </button>
  <div class="label" style="margin:14px 0 8px">Chapters</div>${chapters}
  <div class="label" style="margin:18px 0 8px">Practice runs</div>${runs}
  <button class="btn gold" onclick="startSim()">
    <div class="row"><span>🏆 Run C · Tournament night</span><span class="score">${SIM.length} hands</span></div>
    <div class="sub">Play the full night, phase by phase. Your stack lives and dies with your decisions.</div>
  </button>`;
}

function lessonHTML(){
  const m=CHAPTERS[S.modIdx];
  const paras=m.lesson.map((p,i)=>typeof p==="string"?`<p class="lesson-p ${i===0?"lead":""}">${esc(p)}</p>`:VIZ[p.viz]()).join("");
  return `<button class="back" onclick="go('home')">← Home</button>
  <div class="label">${m.title}</div>
  <h2 style="font-size:25px;margin:6px 0 16px">${m.tagline}</h2>
  ${paras}
  ${m.grid?gridHTML():""}
  <button class="btn gold center" style="margin-top:10px" onclick="go('quiz')">Deal the hands (${m.hands.length})</button>`;
}

function quizHTML(){
  const m=CHAPTERS[S.modIdx],h=m.hands[S.qIdx];
  const answered=S.picked!==null,correct=answered&&S.picked===h.correct;
  return `<div class="topbar">
    <button class="back" style="margin:0" onclick="go('lesson')">← Lesson</button>
    <span>Hand ${S.qIdx+1} of ${m.hands.length}</span></div>
  ${ringHTML(h.hero,h.raiser)}
  <div class="cards-row">${cardHTML(h.cards[0])}${cardHTML(h.cards[1])}</div>
  ${h.board?`<div class="board-lbl">BOARD</div><div class="board-strip" style="margin-bottom:10px">${h.board.map(xsCard).join("")}</div>`:""}
  ${h.opp?`<div class="board-lbl">OPPONENT SHOWS</div><div class="board-strip" style="margin-bottom:10px">${h.opp.map(xsCard).join("")}</div>`:""}
  <p class="scenario">${esc(h.scenario)}</p>
  ${optionsHTML(h,S.picked,"answer")}
  ${helpHTML(h,m.id)}
  ${answered?feedbackHTML(correct,correct?"CORRECT":"NOT THIS TIME",h.explain,h.rule):""}
  ${answered?`<button class="btn gold center" onclick="next()">${S.qIdx+1<m.hands.length?"Next hand →":"Finish chapter"}</button>`:""}`;
}

function doneHTML(){
  const m=CHAPTERS[S.modIdx],total=m.hands.length,pct=Math.round(S.sessionRight/total*100);
  const msg=pct===100?"Flawless. Next chapter.":pct>=70?"Solid — reread the lesson, rerun the misses.":"Another pass through the lesson before moving on.";
  return `<div class="center-wrap">
    <div class="label">${m.title} complete</div>
    <div class="big-num">${S.sessionRight}/${total}</div>
    <p class="fine">${msg}</p>
    <button class="btn center" onclick="replayQuiz()">Replay hands</button>
    <button class="btn gold center" onclick="go('home')">Home</button></div>`;
}

function runHTML(){
  const h=S.run.hands[S.rIdx];
  const answered=S.rPicked!==null,correct=answered&&S.rPicked===h.correct;
  return `<div class="topbar">
    <button class="back" style="margin:0" onclick="go('home')">✕ End run</button>
    <span>${S.run.title} · ${S.rIdx+1}/${S.run.hands.length} · Score ${S.rRight}</span></div>
  ${ringHTML(h.hero,h.raiser)}
  <div class="cards-row">${cardHTML(h.cards[0])}${cardHTML(h.cards[1])}</div>
  ${h.board?`<div class="board-lbl">BOARD</div><div class="board-strip" style="margin-bottom:10px">${h.board.map(xsCard).join("")}</div>`:""}
  ${h.opp?`<div class="board-lbl">OPPONENT SHOWS</div><div class="board-strip" style="margin-bottom:10px">${h.opp.map(xsCard).join("")}</div>`:""}
  <p class="scenario">${esc(h.scenario)}</p>
  ${optionsHTML(h,S.rPicked,"runAnswer")}
  ${helpHTML(h,null)}
  ${answered?feedbackHTML(correct,correct?"CORRECT":"NOT THIS TIME",h.explain,h.rule):""}
  ${answered?`<button class="btn gold center" onclick="runNext()">${S.rIdx+1<S.run.hands.length?"Next →":"Finish run"}</button>`:""}`;
}

function runDoneHTML(){
  const total=S.run.hands.length,pct=Math.round(S.rRight/total*100);
  const msg=pct===100?"Perfect. Move up a level.":pct>=75?"Solid. Rerun the misses, then move on.":"Reread the chapters this run tests, then try again.";
  return `<div class="center-wrap">
    <div class="label">${S.run.title} complete</div>
    <div class="big-num">${S.rRight}/${total}</div>
    <p class="fine">${msg}</p>
    <button class="btn center" onclick="startRun('${S.run.id}')">Run it again</button>
    <button class="btn gold center" onclick="go('home')">Home</button></div>`;
}

function simHTML(){
  const h=SIM[S.sIdx];
  const answered=S.sPicked!==null,correct=answered&&S.sPicked===h.correct;
  const result=answered?(correct?h.win:h.lose):null;
  let verdict="";
  if(answered){
    if(correct)verdict="WELL PLAYED"+(result.d>0?` · +${result.d}bb`:"");
    else verdict=(result.d<0?`${result.d}bb · `:"")+"NOT THE PLAY";
  }
  return `<div class="topbar">
    <button class="back" style="margin:0" onclick="go('home')">✕ Leave table</button>
    <span>Hand ${S.sIdx+1}/${SIM.length}</span></div>
  <div class="simbar"><span class="lvl">${h.level}</span>
    <span class="stk ${S.stack<=15?"danger":""}">Stack: ${S.stack}bb</span></div>
  ${ringHTML(h.hero,h.raiser)}
  <div class="cards-row" style="margin:6px 0 12px">${cardHTML(h.cards[0])}${cardHTML(h.cards[1])}</div>
  ${h.board?`<div class="board-lbl">BOARD</div><div class="board-strip" style="margin-bottom:10px">${h.board.map(xsCard).join("")}</div>`:""}
  ${h.opp?`<div class="board-lbl">OPPONENT SHOWS</div><div class="board-strip" style="margin-bottom:10px">${h.opp.map(xsCard).join("")}</div>`:""}
  <p class="scenario">${esc(h.scenario)}</p>
  ${optionsHTML(h,S.sPicked,"simAnswer")}
  ${helpHTML(h,null)}
  ${answered?feedbackHTML(correct,verdict,result.note,h.rule):""}
  ${answered?`<button class="btn gold center" onclick="simNext()">${S.sIdx+1<SIM.length?"Next hand →":"See the result"}</button>`:""}`;
}

function simDoneHTML(){
  const perfect=S.sRight===SIM.length;
  const trophy=S.sRight>=11?"🏆":S.sRight>=8?"🥈":"🪑";
  const title=S.sRight>=11?((S.name?esc(S.name)+" — ":"")+"Office Champion"):S.sRight>=8?"Final table finish":"Busted mid-field";
  const msg=perfect?"Flawless run. Bring this exact game on the night."
    :S.sRight>=11?"A couple of leaks, but champion play. Note which rules you missed."
    :S.sRight>=8?"The misses cost you the trophy — each one showed its rule. Rerun it."
    :"The good news: every mistake came with the rule that fixes it. Reread chapter 3 and run it back.";
  return `<div class="center-wrap" style="margin-top:44px">
    <div class="label">Tournament over</div>
    <div style="font-size:56px;margin:14px 0 0">${trophy}</div>
    <h2 style="font-size:28px;margin:8px 0 2px">${title}</h2>
    <div style="font-size:15px;margin-bottom:4px">Final stack: ${S.stack}bb · ${S.sRight}/${SIM.length} correct decisions</div>
    <p class="fine">${msg}</p>
    <button class="btn center" onclick="startSim()">Play the night again</button>
    <button class="btn gold center" onclick="go('home')">Home</button></div>`;
}

/* ============ actions ============ */
function go(s){S.screen=s;render();}
function setGrid(p){S.gridPos=p;render();}
function setGridPhase(p){S.gridPhase=p;render();}
function openModule(i){track("chapter-"+(i+1)+"-opened");S.modIdx=i;S.qIdx=0;S.picked=null;S.sessionRight=0;S.help=false;S.screen="lesson";render();}
function replayQuiz(){S.qIdx=0;S.picked=null;S.sessionRight=0;S.help=false;S.screen="quiz";render();}
function answer(i){
  if(S.picked!==null)return;
  S.picked=i;
  if(i===CHAPTERS[S.modIdx].hands[S.qIdx].correct)S.sessionRight++;
  render();
}
function next(){
  const m=CHAPTERS[S.modIdx];
  if(S.qIdx+1<m.hands.length){S.qIdx++;S.picked=null;S.help=false;}
  else{S.scores[m.id]={right:S.sessionRight,total:m.hands.length};saveScores(S.scores);S.screen="done";}
  render();
}
function startRun(id){
  S.run=id==="runA"?RUN_A:RUN_B;
  S.rIdx=0;S.rPicked=null;S.rRight=0;S.help=false;S.screen="run";render();
}
function runAnswer(i){
  if(S.rPicked!==null)return;
  S.rPicked=i;
  if(i===S.run.hands[S.rIdx].correct)S.rRight++;
  render();
}
function runNext(){
  if(S.rIdx+1<S.run.hands.length){S.rIdx++;S.rPicked=null;S.help=false;}
  else{S.scores[S.run.id]={right:S.rRight,total:S.run.hands.length};saveScores(S.scores);S.screen="runDone";}
  render();
}
function startSim(){track("sim-started");S.sIdx=0;S.sPicked=null;S.stack=300;S.sRight=0;S.help=false;S.screen="sim";render();}
function simAnswer(i){
  if(S.sPicked!==null)return;
  const h=SIM[S.sIdx];
  S.sPicked=i;
  const correct=i===h.correct;
  if(correct)S.sRight++;
  S.stack=Math.max(1,Math.round((S.stack+(correct?h.win.d:h.lose.d))*10)/10);
  render();
}
function simNext(){
  if(S.sIdx+1<SIM.length){
    const nh=SIM[S.sIdx+1];
    if(nh.setStack)S.stack=nh.setStack;
    S.sIdx++;S.sPicked=null;S.help=false;
  }else{track("sim-finished");track(S.sRight>=11?"sim-champion":"sim-nonchampion");S.screen="simDone";}
  render();
}

(function boot(){
  const pr=loadProfile();
  S.name=pr.name||"";
  if(!pr.skipped)S.screen="intro";
  render();
})();
</script>
</body>
</html>
